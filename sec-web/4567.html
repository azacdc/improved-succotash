<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>组</title>
<style>
  :root {
    
    --card: #ffffff;
    --ink: #111114;
    --ink-soft: rgba(60,60,67,.6);
    --line: rgba(60,60,67,.14);
    --track-off: rgba(120,120,128,.5);
    --track-on: #34c759;
    --thumb: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      
      --card: #1c1c1e;
      --ink: #f5f5f7;
      --ink-soft: rgba(235,235,245,.6);
      --line: rgba(84,84,88,.6);
      --track-off: rgba(120,120,128,.5);
      --track-on: #30d158;
    }
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -.015em; margin: 8px 4px 20px; }
  .hint { font-size: 13px; color: var(--ink-soft); margin: 8px 16px 24px; }

  .group { background: var(--card); border-radius: 26px; overflow: visible; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 52px; padding: 0 16px; gap: 12px;
  }
  .row + .row { box-shadow: inset 0 .5px 0 var(--line); }
  .row label { font-size: 17px; }
  .row.big { justify-content: center; gap: 48px; min-height: 96px; }
  .row.big .switch { transform: scale(1.6); }

  /* 尺寸与参数取自 Kyant AndroidLiquidGlass 的 LiquidToggle：轨道 64×28，滑块 40×24，行程 20 */
  .switch {
    --p: 0;
    --press: 0;
    position: relative; flex: none;
    width: 64px; height: 28px; padding: 0; border: 0; margin: 0;
    border-radius: 999px; background: none;
    cursor: pointer; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .switch .track {
    position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
    background: var(--track-off);
  }
  .switch .track::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: var(--track-on);
    opacity: var(--p);
  }
  .switch:focus-visible { outline: 2px solid #0a84ff; outline-offset: 3px; }

  .thumb {
    position: absolute; left: 2px; top: 2px;
    width: 40px; height: 24px; border-radius: 12px;
    pointer-events: none; will-change: transform;
  }
  .thumb .glass {
    position: absolute; inset: 0; border-radius: inherit;
    -webkit-backdrop-filter: blur(calc(8px * (1 - var(--press)))) saturate(1.2);
            backdrop-filter: blur(calc(8px * (1 - var(--press)))) saturate(1.2);
    box-shadow:
      inset 0 4px 4px rgba(0,0,0,calc(.3 * var(--press) * .35)),
      0 .7px 4px rgba(0,0,0,.05);
  }
  .switch.refract .thumb .glass {
    -webkit-backdrop-filter: url(#lg-knob) saturate(1.2);
            backdrop-filter: url(#lg-knob) saturate(1.2);
  }
  /* 静止时白色覆盖层 alpha=1 遮住玻璃，按下时随 pressProgress 淡出 */
  .thumb .solid {
    position: absolute; inset: 0; border-radius: inherit;
    background: var(--thumb);
    box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.2);
    opacity: calc(1 - var(--press));
  }
  .thumb .rim {
    position: absolute; inset: 0; border-radius: inherit; padding: .5px;
    background: linear-gradient(135deg, rgba(255,255,255,1), rgba(255,255,255,.15) 35%, rgba(255,255,255,.15) 65%, rgba(255,255,255,1));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    opacity: var(--press);
  }

  .switch[aria-disabled="true"] { opacity: .45; cursor: default; }

  .btn {
    --press: 0;
    position: relative; height: 48px; padding: 0 16px;
    border: 0; border-radius: 999px; background: none;
    font: inherit; font-size: 15px; font-weight: 400; color: #000;
    cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    will-change: transform;
  }
  .btn.tinted { color: #fff; }
  .btn .glass {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: var(--surface, rgba(255,255,255,.3));
    -webkit-backdrop-filter: url(#lg-btn) blur(2px) saturate(1.5);
            backdrop-filter: url(#lg-btn) blur(2px) saturate(1.5);
    box-shadow: 0 4px 24px rgba(0,0,0,.1);
  }
  .btn.tinted .glass { background: rgba(255,141,40,.75); }
  /* 源码高光：45° 方向、0.5px 宽、alpha 0.5 */
  .btn .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: .5px;
    background: linear-gradient(135deg, rgba(255,255,255,.5), rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,.5));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  /* 按下时的提亮层 */
  .btn .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(80px 60px at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
    opacity: var(--press);
  }
  .btn span { position: relative; }
  .btn:focus-visible { outline: 2px solid #0088ff; outline-offset: 3px; }

  @media (prefers-color-scheme: dark) { .scard { background: #121212; color: #fff; } }
  .label { font-size: 15px; display: flex; justify-content: space-between; }
  .label output { font-variant-numeric: tabular-nums; opacity: .6; }

  /* 源码：轨道高 6、圆角 3；滑块 40×24，左右各探出 10px；触控区高 48 */
  .slider {
    --press: 0;
    position: relative; height: 48px; margin: 0 10px;
    touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
  }
  .slider:focus-visible { outline: 2px solid #0088ff; outline-offset: 4px; border-radius: 8px; }
  .slider .track, .slider .fill { position: absolute; left: -10px; top: 21px; height: 6px; border-radius: 3px; }
  .slider .track { right: -10px; background: rgba(120,120,120,.2); }
  .slider .fill { background: #0088ff; }
  @media (prefers-color-scheme: dark) {
    .slider .track { background: rgba(120,120,128,.36); }
    .slider .fill { background: #0091ff; }
  }
  .slider .knob {
    position: absolute; left: -10px; top: 12px; width: 40px; height: 24px; border-radius: 12px;
    pointer-events: none; will-change: transform;
  }
  .slider .knob .glass {
    position: absolute; inset: 0; border-radius: inherit;
    box-shadow: 0 .67px 4px rgba(0,0,0,.05), inset 0 4px 4px -4px rgba(0,0,0,calc(.3 * var(--press)));
  }
  .slider.refract .knob .glass {
    -webkit-backdrop-filter: url(#lg-sknob) saturate(1.2);
            backdrop-filter: url(#lg-sknob) saturate(1.2);
  }
  /* 源码高光：45°、宽 0.5/1.5 dp，只在按下时出现 */
  .slider .knob .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: .5px;
    background: linear-gradient(135deg, #fff, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, #fff);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    opacity: var(--press);
  }
  /* 静止时是白色实心滑块，按下后淡出露出玻璃 */
  .slider .knob .solid {
    position: absolute; inset: 0; border-radius: inherit; background: #fff;
    box-shadow: 0 .67px 4px rgba(0,0,0,.12);
    opacity: calc(1 - var(--press));
  }

  :root {
    box-sizing: border-box;
    --page: #ffffff;
    --ink: #111114;
    --ink-soft: rgba(17,17,20,.55);
    --row-line: rgba(17,17,20,.08);
    --tab-idle: rgba(20,20,24,.78);
    --tab-active: #fa233b;
    --glass-tint: rgba(255,255,255,.12);
    --lens-tint: rgba(0,0,0,.07);
    --rim-hi: rgba(255,255,255,.8);
    --rim-lo: rgba(255,255,255,.2);
    --drop: rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #000000;
      --ink: #f5f5f7;
      --ink-soft: rgba(245,245,247,.55);
      --row-line: rgba(245,245,247,.1);
      --tab-idle: rgba(245,245,247,.8);
      --tab-active: #ff4560;
      --glass-tint: rgba(30,30,34,.22);
      --lens-tint: rgba(255,255,255,.1);
      --rim-hi: rgba(255,255,255,.35);
      --rim-lo: rgba(255,255,255,.08);
      --drop: rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --page: #000000;
    --ink: #f5f5f7;
    --ink-soft: rgba(245,245,247,.55);
    --row-line: rgba(245,245,247,.1);
    --tab-idle: rgba(245,245,247,.8);
    --tab-active: #ff4560;
    --glass-tint: rgba(30,30,34,.22);
    --lens-tint: rgba(255,255,255,.1);
    --rim-hi: rgba(255,255,255,.35);
    --rim-lo: rgba(255,255,255,.08);
    --drop: rgba(0,0,0,.5);
  }

  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { margin: 10px 0 16px; font-size: 34px; font-weight: 800; letter-spacing: -.015em; }



  /* ---------- 底部 dock ---------- */
  .dock {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    width: min(560px, calc(100vw - 32px)); transform: translateX(-50%); z-index: 10;
    display: flex; justify-content: center; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .stack {
    --lift: 0;
    position: relative; flex: 0 1 380px; height: 64px;
    pointer-events: auto; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  /* 整条底栏按下后会略微放大，并随手指方向倾斜、拉伸（由脚本逐帧写入 transform） */
  .bar { position: absolute; inset: 0; will-change: transform; }
  .round { position: relative; flex: none; width: 64px; height: 64px; pointer-events: auto; }

  .dock .glass {
    position: absolute; inset: 0; border-radius: 999px;
    transform: translateZ(0); backface-visibility: hidden;
    background: var(--glass-tint);
    -webkit-backdrop-filter: blur(2px) saturate(1.9) brightness(1.06);
            backdrop-filter: blur(2px) saturate(1.9) brightness(1.06);
    box-shadow:
      inset 0 0 0 .5px var(--rim-lo),
      inset 0 .5px 0 var(--rim-hi),
      0 8px 24px -8px var(--drop),
      0 1px 3px rgba(0,0,0,.06);
  }
  /* 手指按住处在底栏玻璃上泛起的局部光斑 */
  .dock .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(90px 60px at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.18), rgba(255,255,255,0) 70%);
    opacity: calc(var(--lift) * .8);
    pointer-events: none;
  }

  /* ---------- 图标：底层灰色 + 上层“墨水”层 ----------
     底层在透镜范围内被挖空；墨水层（强调色、放大 16%）只在透镜范围内显示，
     这样图标看起来是被透镜“染色并放大”，而不是整体变色。 */
  .tabs { position: absolute; inset: 4px; display: grid; grid-template-columns: repeat(4, 1fr); }
  .tabs.ink { pointer-events: none; }
  .tab {
    display: grid; place-items: center; align-content: center; gap: 3px;
    border: 0; background: none; padding: 0; margin: 0;
    color: var(--tab-idle);
    font: inherit; font-size: 10px; font-weight: 500; letter-spacing: 0;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tab svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ink .tab .f { fill: currentColor; }
  .ink .tab {
    color: var(--tab-active);
    transform: scale(calc(1 + .1 * var(--lift)));
  }
  .tab:focus-visible { outline: 2px solid var(--tab-active); outline-offset: -3px; border-radius: 999px; }

  /* ---------- 透镜 ----------
     静止：嵌在底栏里的淡色胶囊。按下：变成清澈、边缘强折射、带彩色边缘的气泡，
     比底栏更高更宽。尺寸固定为浮起时的大小，静止态靠缩放得到。 */
  .lens {
    position: absolute; left: 0; top: 50%;
    border-radius: 999px;
    background: transparent;
    -webkit-backdrop-filter: saturate(1.5) brightness(1.1);
            backdrop-filter: saturate(1.5) brightness(1.1);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,calc(.8 * var(--lift))),
      inset 0 -1px 1px rgba(255,255,255,calc(.4 * var(--lift))),
      0 calc(6px * var(--lift)) calc(18px * var(--lift)) -6px var(--drop);
    transform: translate3d(0, -50%, 0);
    pointer-events: none;
    will-change: transform;
  }
  .lens::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: var(--lens-tint);
    opacity: calc(1 - var(--lift));
  }
  .lens::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.15) 35%, rgba(255,255,255,0) 50%, rgba(255,255,255,.15) 65%, rgba(255,255,255,.9));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    opacity: var(--lift);
  }

  /* 折射只在按下时开启，静止时关掉，避免滚动时闪烁 */
  .lens.refract {
    -webkit-backdrop-filter: url(#lg-lens) saturate(1.5) brightness(1.1);
            backdrop-filter: url(#lg-lens) saturate(1.5) brightness(1.1);
  }
  .stack.refract #barGlass {
    -webkit-backdrop-filter: url(#lg-bar) blur(2px) saturate(1.9) brightness(1.06);
            backdrop-filter: url(#lg-bar) blur(2px) saturate(1.9) brightness(1.06);
  }

  .round button {
    position: absolute; inset: 0; border: 0; background: none; padding: 0;
    display: grid; place-items: center; color: var(--tab-idle);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .3s cubic-bezier(.3,1.5,.5,1);
  }
  .round button:active { transform: scale(1.12); }
  .round svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .round button:focus-visible { outline: 2px solid var(--tab-active); border-radius: 999px; }

  @media (prefers-reduced-motion: reduce) {
    .round button { transition: none; }
  }

  html, body { height: 100%; margin: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  body { background: linear-gradient(145deg, #111722 0%, #171b2b 46%, #111923 100%); color: #111114;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .bg { position: fixed; inset: 0; }
  .bg {
    background: linear-gradient(145deg, #111722 0%, #171b2b 46%, #111923 100%);
  }
  .snowfall { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }
  .screen { min-height: 100vh; }
  .workspace {
    position: relative; z-index: 2;
    width: min(760px, calc(100% - 32px));
    margin: 0 auto;
    padding: clamp(30px, 7vh, 68px) 0 124px;
    color: #f4f6f5;
  }
  .workspace-heading { margin: 0 0 26px; }
  .workspace-heading h2 { margin: 0 0 8px; font-size: clamp(25px, 5vw, 32px); font-weight: 650; letter-spacing: -.04em; }
  .workspace-heading p { margin: 0; color: rgba(239,243,245,.62); font-size: 14px; line-height: 1.6; }
  .section-panel[hidden] { display: none; }
  .edit-grid { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; }
  .edit-box {
    flex: 0 1 auto; width: calc((100% - 42px) / 4); min-width: min(100%, 160px); max-width: 100%; height: 108px;
    padding: 14px; overflow: auto;
    border: 1px solid rgba(255,255,255,.14); border-radius: 17px;
    background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 28px rgba(0,0,0,.12);
    color: #f4f6f5; font: inherit; font-size: 14px; line-height: 1.55;
    resize: both;
  }
  .edit-box::placeholder { color: rgba(239,243,245,.42); }
  .edit-box:focus { outline: 2px solid rgba(194,240,221,.72); outline-offset: 2px; }
  .infection-scene { display: flex; flex-direction: column; align-items: center; margin: 18px auto 0; }
  .infection-scene svg { display: block; width: min(280px, 100%); height: auto; overflow: visible; }
  .infection-scene .monitor-frame { fill: rgba(255,255,255,.06); stroke: rgba(239,243,245,.72); stroke-width: 2; }
  .infection-scene .monitor-screen { fill: #1b2635; stroke: rgba(239,243,245,.42); stroke-width: 1.5; }
  .infection-scene .monitor-detail { fill: none; stroke: rgba(239,243,245,.72); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .infection-scene .infected-screen { fill: #ed334b; opacity: 0; animation: screen-infection 3.8s ease-in-out infinite; }
  .infection-scene .infection-x { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; opacity: 0; animation: infection-mark 3.8s ease-in-out infinite; }
  .infection-scene .virus { animation: virus-attack 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .infection-scene .virus-core { fill: #ff6577; stroke: #ffd8de; stroke-width: 1.5; }
  .infection-scene .virus-spike { stroke: #ff8c9a; stroke-width: 3; stroke-linecap: round; }
  .infection-scene .virus-eye { fill: #39151e; }
  .infection-caption { margin: 4px 0 0; color: rgba(239,243,245,.68); font-size: 12px; letter-spacing: .08em; }
  .scam-scene { display: flex; flex-direction: column; align-items: center; margin: 18px auto 14px; }
  .scam-scene svg { display: block; width: min(320px, 100%); height: auto; overflow: visible; }
  .scam-scene .phone-body { fill: rgba(255,255,255,.07); stroke: rgba(239,243,245,.72); stroke-width: 2; }
  .scam-scene .phone-screen { fill: #1b2635; stroke: rgba(239,243,245,.35); stroke-width: 1.4; }
  .scam-scene .phone-detail { fill: none; stroke: rgba(239,243,245,.65); stroke-width: 2; stroke-linecap: round; }
  .scam-scene .call-icon { fill: none; stroke: #8be0b3; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .scam-scene .ring-wave { fill: none; stroke: #8be0b3; stroke-width: 2; stroke-linecap: round; opacity: 0; animation: phone-ring 3.8s ease-in-out infinite; }
  .scam-scene .call-link { fill: none; stroke: rgba(139,224,179,.6); stroke-width: 2; stroke-dasharray: 4 6; animation: call-connect 3.8s linear infinite; }
  .scam-scene .transfer-dot { fill: #ffd38a; opacity: 0; animation: transfer-flight 3.8s ease-in-out infinite; }
  .scam-scene .money-mark { fill: none; stroke: #ffd38a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; animation: transfer-flight 3.8s ease-in-out infinite; }
  .scam-result { margin: -2px 0 0; color: #ff9ba7; font-size: 13px; font-weight: 600; letter-spacing: .04em; opacity: 0; animation: scam-result 3.8s ease-in-out infinite; }
  .scam-result strong { color: #ffd38a; font-size: 18px; font-variant-numeric: tabular-nums; }
  .scam-caption { margin: 3px 0 0; color: rgba(239,243,245,.58); font-size: 11px; }
  .phishing-scene { display: flex; flex-direction: column; align-items: center; margin: 18px auto 14px; }
  .phishing-scene svg { display: block; width: min(340px, 100%); height: auto; overflow: visible; }
  .phishing-scene .computer-frame { fill: rgba(255,255,255,.07); stroke: rgba(239,243,245,.72); stroke-width: 2; }
  .phishing-scene .browser-screen { fill: #1b2635; stroke: rgba(239,243,245,.36); stroke-width: 1.4; }
  .phishing-scene .browser-bar { fill: rgba(255,255,255,.1); }
  .phishing-scene .browser-detail { fill: none; stroke: rgba(239,243,245,.66); stroke-width: 1.5; stroke-linecap: round; }
  .phishing-scene .phish-address { fill: #ff9ba7; font: 6px sans-serif; }
  .phishing-scene .web-card { fill: rgba(255,255,255,.08); stroke: rgba(239,243,245,.3); stroke-width: 1; }
  .phishing-scene .web-line { stroke: rgba(239,243,245,.6); stroke-width: 2; stroke-linecap: round; }
  .phishing-scene .fake-lock { fill: none; stroke: #ff6577; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .phishing-scene .computer-base { fill: none; stroke: rgba(239,243,245,.72); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .phishing-scene .data-path { fill: none; stroke: rgba(255,211,138,.7); stroke-width: 2; stroke-dasharray: 4 5; animation: data-path 3.8s linear infinite; }
  .phishing-scene .stolen-card { opacity: 0; animation: stolen-card 3.8s ease-in-out infinite; }
  .phishing-scene .stolen-card rect { fill: #38232c; stroke: #ff6577; stroke-width: 1.5; }
  .phishing-scene .stolen-card circle { fill: #ff9ba7; }

<script>
(function () {
  var boxes = Array.prototype.slice.call(document.querySelectorAll('.edit-box'));
  var status = document.getElementById('save-status');
  var storageAvailable = true;
  var prefix = 'editable-sections-v1-';

  boxes.forEach(function (box) {
    var key = prefix + box.getAttribute('data-edit-key');
    var sizeKey = key + '-size';
    var resizing = false;
    var savedSize;
    try {
      box.value = localStorage.getItem(key) || '';
      savedSize = localStorage.getItem(sizeKey);
    } catch (error) {
      storageAvailable = false;
      status.textContent = '浏览器存储不可用，编辑内容仅保留到关闭此页面。';
      return;
    }
    if (savedSize) {
      try {
        var size = JSON.parse(savedSize);
        if (size && Number.isFinite(size.width) && size.width > 0 && size.width <= 10000 &&
            Number.isFinite(size.height) && size.height > 0 && size.height <= 10000) {
          box.style.width = size.width + 'px';
          box.style.height = size.height + 'px';
        }
      } catch (error) {
        status.textContent = '尺寸恢复失败，使用默认大小。';
      }
    }
    box.addEventListener('input', function () {
      if (!storageAvailable) return;
      try {
        localStorage.setItem(key, box.value);
        status.textContent = '';
      } catch (error) {
        storageAvailable = false;
        status.textContent = '保存失败，编辑内容仅保留到关闭此页面。';
      }
    });

    function saveSize(finish) {
      if (!resizing) return;
      if (finish) resizing = false;
      if (!storageAvailable) return;
      try {
        var style = window.getComputedStyle(box);
        localStorage.setItem(sizeKey, JSON.stringify({
          width: parseFloat(style.width),
          height: parseFloat(style.height)
        }));
        status.textContent = '';
      } catch (error) {
        storageAvailable = false;
        status.textContent = '保存失败，编辑内容仅保留到关闭此页面。';
      }
    }

    box.addEventListener('pointerdown', function (event) {
      var rect = box.getBoundingClientRect();
      resizing = event.clientX >= rect.right - 24 && event.clientY >= rect.bottom - 24;
    });
    if (window.ResizeObserver) {
      new ResizeObserver(function () {
        if (resizing) saveSize(false);
      }).observe(box);
    }
    window.addEventListener('pointerup', function () { saveSize(true); });
    window.addEventListener('pointercancel', function () { saveSize(true); });
  });
})();
</script>
<script>
(function () {
  var canvas = document.querySelector('.snowfall');
  var context = canvas.getContext('2d');
  var flakes = [];
  var width = 0, height = 0, last = 0;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    var ratio = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    var count = Math.max(60, Math.min(240, Math.round(width * height / 7000)));
    flakes = Array.from({ length: count }, function () {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        radius: .7 + Math.random() * 1.8,
        speed: 16 + Math.random() * 32,
        drift: -9 + Math.random() * 18,
        phase: Math.random() * Math.PI * 2
      };
    });
    draw(0);
  }

  function draw(delta) {
    context.clearRect(0, 0, width, height);
    flakes.forEach(function (flake) {
      flake.y += flake.speed * delta;
      flake.x += (flake.drift + Math.sin(flake.phase + flake.y * .012) * 7) * delta;
      if (flake.y > height + flake.radius) {
        flake.y = -flake.radius;
        flake.x = Math.random() * width;
      }
      if (flake.x < -flake.radius) flake.x = width + flake.radius;
      if (flake.x > width + flake.radius) flake.x = -flake.radius;
      context.beginPath();
      context.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
      context.fillStyle = 'rgba(255,255,255,.68)';
      context.fill();
    });
  }

  function frame(now) {
    var delta = last ? Math.min((now - last) / 1000, .05) : 0;
    last = now;
    draw(delta);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  if (!reduceMotion) requestAnimationFrame(frame);
})();
</script>
